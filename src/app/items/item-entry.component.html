<!-- Page Content -->
<form (ngSubmit)="onSubmit()" #personForm="ngForm">
  <div class="container">
    <div class="row my-blue-box">
      <div class="col-lg-12 text-center" style="padding-top: 20px;">
        <div class="container" style="padding-left: 0; padding-right: 0;">
          <div class="row p-1">
            <div class="col-sm" style="text-align: left;">
              <h6>{{ title }}</h6>
            </div>
            <div class="col-sm" style="text-align: right;">
              <input type="submit" class="btn btn-success" [disabled]="!personForm.form.valid || !nameChanged" value="Update Name"/>
            </div>
            <div class="col-sm" style="text-align: right;">
              <a routerLink="/edit_item/{{ childItem.id }}"><button class="btn btn-success">Edit</button></a>
            </div>
          </div>
        </div>
        <div *ngIf="childItem">
          <div class="container box" style="margin-top: 10px;">
            <div class="row p-1">
              <div class="col-2" style="text-align: right;">
                <strong><em>Id:</em></strong>
              </div>
              <div class="col" style="text-align: left;">
                {{ childItem?.id }}
              </div>
            </div>
            <div class="row p-1">
              <div class="col-2" style="text-align: right;">
                <strong><em>Country:</em></strong>
              </div>
              <div class="col" style="text-align: left;">
                {{ childItem?.country?.name }}
              </div>
            </div>
            <div class="row p-1">
              <div class="col-2" style="text-align: right;">
                <strong><em>Passport:</em></strong>
              </div>
              <div class="col" style="text-align: left;">
                {{ childItem?.passport?.number }}
              </div>
            </div>
            <div class="form-group">
              <div class="row p-1">
                <div class="col-2" style="text-align: right;">
                  <strong><em>First Name:</em></strong>
                </div>
                <div class="col-2" style="text-align: left;">
                  <input name="firstname" [(ngModel)]="childItem.firstname" (ngModelChange)="onNameChange()" class="col" style="text-align: left;" required>
                </div>
              </div>
              <div class="row p-1">
                <div class="col-2" style="text-align: right;">
                  <strong><em>Last Name:</em></strong>
                </div>
                <div class="col-2" style="text-align: left;">
                  <input name="lastname" [(ngModel)]="childItem.lastname" (ngModelChange)="onNameChange()" class="col" style="text-align: left;" required>
                </div>
              </div>
              <div class="row p-1">
                <div class="col-2" style="text-align: right;">
                  <strong><em>Position:</em></strong>
                </div>
                <div class="col" style="text-align: left;">
                  {{ childItem?.position }}
                </div>
              </div>
              <div class="row p-1">
                <div class="col-2" style="text-align: right;">
                  <strong><em>Age:</em></strong>
                </div>
                <div class="col" style="text-align: left;">
                  {{ childItem?.age }}
                </div>
              </div>
              <br>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
