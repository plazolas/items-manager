<!-- Page Content -->
<div class="container">
    <br>
    <div class="row my-blue-box">
        <div class="col-lg-12 text-center" style="padding-top: 20px;">
            <div class="container" style="padding-left: 0px; padding-right: 0px;">
                <div class="row">
                    <div class="col-sm" style="text-align: left;">
                        <h6>{{ title }}</h6>
                    </div>
                    <div class="col-sm" style="text-align: right;">
                        <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
                    </div>
                </div>
            </div>
            <div *ngIf="person.id">
                <h6>Editing {{ person?.firstname | uppercase}} {{ person?.lastname | uppercase }}</h6>
                <br>
                <div class="container" style="margin-top: 10px;">
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="id">id: </label>
                        </div>
                        <div class="col-md-4">
                            <input id="id" value="{{ person.id }}" disabled>
                        </div>
                    </div>
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="firstName">First Name: </label>
                        </div>
                        <div class="col-md-4">
                            <input id="firstName" [(ngModel)]="person.firstname" placeholder="First Name">
                        </div>
                    </div>
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="lastName">Last Name: </label>
                        </div>
                        <div class="col-md-4">
                            <input id="lastName" [(ngModel)]="person.lastname" placeholder="Last Name">
                        </div>
                    </div>
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="passport">Passport: </label>
                        </div>
                        <div class="col-md-4" *ngIf="person.passport; else noPassport">
                            <input id="passport" type="text" value="{{ person.passport.number }}" disabled>
                        </div>
                        <ng-template #noPassport>
                            <div class="col-md-4">
                                <input id="pass" type="text" placeholder="N/A" disabled>
                            </div>
                        </ng-template>
                    </div>
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="country">Country: </label>
                        </div>
                        <div class="col-md-4">
                            <input id="country" *ngIf="isLoading();" [(ngModel)]="person.country.name" placeholder="Country">
                        </div>
                    </div>
                    <div class="row p-1">
                        <div class="col-md-4">
                            <label for="country">Age: </label>
                        </div>
                        <div class="col-md-4">
                            <input id="age" *ngIf="isLoading();" [(ngModel)]="person.age">
                            <input id="position" *ngIf="isLoading();" [(ngModel)]="person.position" hidden>
                            <input id="boss" *ngIf="isLoading();" [(ngModel)]="person.boss" hidden>
                        </div>
                    </div>
                    <div class="row jasmine-errored">
                        <div class="col-md-12">
                            <br><br>
                        </div>
                    </div>
                </div>
            </div>
            <div class="container" style="padding-left: 0px; padding-right: 0px;">
                <div class="row">
                    <div class="row jasmine-errored">
                        <div class="col-md-12">
                            <br><h1 class="btn-warning">{{ errorStr }}</h1><br>
                        </div>
                    </div>
                    <div class="col-sm" style="text-align: right;">
                        <a routerLink="/list_items/{{ person?.id }}"><button class="btn btn-info">Back</button></a>
                    </div>
                </div>
            </div>
        </div>
        <br>
    </div>
</div>
