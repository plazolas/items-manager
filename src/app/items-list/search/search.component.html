<div style="margin: 50px;">
    <div class="container" style="text-align:center">
        <div class="row">
            <div class="col-12 text-center">
                <h3>Search Employees</h3>
                <input type="text" #searchTerm class="form-control" placeholder=""/>
            </div>
        </div>
        <div class="row" *ngIf="isSearching">
            <div class="col-12 text-center">
                <h4>Searching ... </h4>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12" *ngIf="apiResponse['Response'] == 'true';">
                <div class="col-lg-12" *ngFor="let item of apiResponse['items']; let i = index">
                        <div class="card" style="margin:5px;">
                            <p class="card-title"> {{ i + 1 }}</p>
                            <div class="card-body">
                                <a routerLink="/edit_item/{{ item | slice : 0:3}}">
                                <p class="card-text"> {{ item | slice: 3}}</p>
                                </a>
                            </div>
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>
