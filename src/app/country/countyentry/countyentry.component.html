<!-- Page Content -->
<form (ngSubmit)="onSubmit()" #countryForm="ngForm">
    <div class="container">
        <div class="row my-blue-box">
            <div class="col-lg-12 text-center" style="padding-top: 20px;">
                <div class="container" style="padding-left: 0; padding-right: 0;">
                    <div class="row p-1">
                        <div class="col-sm" style="text-align: left;">
                            <h6>Country</h6>
                        </div>
                        <div class="col-sm" style="text-align: right;">
                            <input type="submit" class="btn btn-success" [disabled]="!countryForm.form.valid || !nameChanged" value="Update Name"/>
                        </div>
                    </div>
                </div>
                <div *ngIf="country">
                    <div class="container box" style="margin-top: 10px;">
                        <div class="row p-1">
                            <div class="col-2" style="text-align: right;">
                                <strong><em>Id:</em></strong>
                            </div>
                            <div class="col" style="text-align: left;">
                                {{ country?.id }}
                            </div>
                        </div>>
                        <div class="form-group">
                            <div class="row p-1">
                                <div class="col-2" style="text-align: right;">
                                    <strong><em>Country Name:</em></strong>
                                </div>
                                <div class="col-2" style="text-align: left;">
                                    <input id="countryname" name="countrytname" [(ngModel)]="country.name" (ngModelChange)="onNameChange()" class="col" style="text-align: left;" required>
                                </div>
                            </div>
                            <br>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
