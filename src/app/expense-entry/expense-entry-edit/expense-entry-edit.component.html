<!-- Page Content -->
<div class="container">
  <div class="row" style="border: solid 2px blue">
    <div class="col-lg-12 text-center" style="padding-top: 20px;">
      <div class="container" style="padding-left: 0px; padding-right: 0px;">
        <div class="row">
          <div class="col-sm" style="text-align: left;">
            <h1>{{ title }}</h1>
          </div>
          <div class="col-sm" style="text-align: right;">
            <button type="button" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
      <div *ngIf="person">
        <h2>Edit {{person?.firstname | uppercase}}</h2>
      <div class="container box" style="margin-top: 10px;">
        <div class="row">
          <div>
            <label for="id">Person id: </label>
            <input id="id" [(ngModel)]="person.id">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="firstname">Person First Name: </label>
            <input id="firstname" [(ngModel)]="person.firstname" placeholder="First Name">
          </div>
        </div>
        <div class="row">
          <div class="col-2" style="text-align: right;">
            <strong><em>Passport:</em></strong>
          </div>
          <div class="col" style="text-align: left;">
            {{ person?.passport?.number }}
          </div>
        </div>
        <div class="row">
          <div class="col-2" style="text-align: right;white-space: nowrap;">
            <strong><em>First Name:</em></strong>
          </div>
          <div class="col" style="text-align: left;">
            {{ person?.firstname }}
          </div>
        </div>
        <div class="row">
          <div class="col-2" style="text-align: right;white-space: nowrap;">
            <strong><em>Last Name:</em></strong>
          </div>
          <div class="col" style="text-align: left;">
            {{ person?.lastname }}
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
</div>
