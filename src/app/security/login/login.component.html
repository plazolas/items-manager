<div class="content" role="main">
    <br>
    <h2 class="text-center" style="color: rgb(0, 0, 250); font-family: Broadway;">OzDev Cloud Solutions</h2>
    <div class="card my-5">
        <h3 class="text-center">Sign In</h3>
        <div class="card-body">
            <form (ngSubmit)="onSubmit()" #userForm="ngForm">
                <div class="form-group">
                    <input type="text" [(ngModel)]="username" class="form-control" id="username" name="username"
                           placeholder="username" required #query="ngModel" required pattern="\w{3,40}">
                    <br>
                    <input type="password" [(ngModel)]="password" class="form-control" id="pwInput" name="password"
                           placeholder="password" required #query="ngModel">
                    <div *ngIf="loginFailed==true" class="form-control mt-4 text-danger">{{failedMsg}}</div>
                </div>
                <br><br>
                <div class="row text-center">
                <button type="submit" [disabled]="!userForm.form.valid" id="loginButton" class="btn btn-primary">
                    Log in
                </button>
                <br>
                </div>
            <div class="row">
                <h3 class="text-center">Create New Account</h3>
                <br>
                <input type="email" [(ngModel)]="useremail" class="form-control" id="useremail" name="myemail"
                       placeholder="Enter your email" pattern="\w{7,40}">
                <div>&nbsp;</div>
                <input type="email" [(ngModel)]="phone" class="form-control" id="phone" name="phone"
                       placeholder="Enter phone number" pattern="\w{7,40}">
                <div>&nbsp;</div>
                <button type="button" class="btn btn-warning" id="createAccountButton" (click)="signUp()">
                    Create Account
                </button>
            </div>
            </form>
        </div>
    </div>
