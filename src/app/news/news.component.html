<div class="container">
    <br>
    <h1>LATEST NEWS</h1>
    <div style="margin: 5px;">
        <div class="container" style="text-align:center">
            <div class="row">
                <div [formGroup]="articleForm" class="col-12">
                    <h4>Search News By Topic:</h4>
                    <table id="tracks" class="table">
                        <tr>
                            <td><input type="text" name="topic" class="form-control" placeholder="Topic" formControlName="topic"></td>
                            <td><input class="btn btn-outline-dark" type="submit" value="SEARCH" (click)="onClickSubmit()"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="container" id="articleDesc">
        <div class="row">
            <div class="container">
            </div>
        </div>
        <div class="row">
            <div class="col-sm-12" style="text-align:center;">
                &nbsp;
            </div>
        </div>
        <hr>
        <div *ngIf="articles.length > 0" class="row">
            <h4 class="bg-dark text-white header-h text-center">FEATURE ARTICLES</h4>
            <div class="container box" style="margin-top: 10px;">
                <table id="artists" class="table table-striped table-bordered table-sm">
                    <thead>
                    <tr>
                        <th>Headline</th>
                        <th>Summary</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let art of articles;">
                        <td style="text-align: center; width:30%">
                            <a href="{{ art?.url }}" title="{{art.source.name}}"><img class="table-image" src="{{ art?.urlToImage }}" height="140" width="250" alt="{{ art?.title | slice:0:72 }}"></a>
                            <h6><a href="{{ art?.url }}">{{ art?.title | uppercase }}</a></h6>
                            <br>
                        </td>
                        <td>
                            <div>{{ art.content | stripTags }}</div>
                            <br>
                            <div><b>Author: </b>{{ art?.author  }}</div>
                            <div><b>Date: </b>{{ art.publishedAt | formatDate }}</div>
                            <div><b>Source: </b><a href="{{ art?.url }}" >{{ art.source.name  }}</a></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
